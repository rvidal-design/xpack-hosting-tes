<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XPACK Wix Hosting Test</title><style>body{font:16px Arial,sans-serif;background:#f3f7fa;color:#152b43;margin:0;padding:24px}main{max-width:640px;margin:auto;background:white;border:1px solid #dce5ef;border-radius:12px;padding:24px}button{background:#133c63;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer}#status{font-weight:bold}</style></head><body><main><h2>XPACK Hosted HTML Test</h2><p>Safe test only. No XPACK application code, customer data, credentials, or integrations.</p><button id="ping" type="button">Test Wix connection</button><p id="status" role="status">Ready to test.</p></main><script>(function(){var s=document.getElementById('status');document.getElementById('ping').addEventListener('click',function(){s.textContent='Ping sent. Waiting for Wix staging page.';window.parent.postMessage({type:'XPACK_STAGING_PING'},'*')});window.addEventListener('message',function(e){if(e.source!==window.parent)return;if(e.data&&e.data.type==='XPACK_STAGING_PONG')s.textContent='Success! Wix staging page replied.'})})();</script></body></html>
